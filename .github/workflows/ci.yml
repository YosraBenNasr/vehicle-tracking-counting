name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer (sans torch : les tests utilisent un détecteur factice)
        run: pip install numpy pandas pyyaml pillow opencv-python-headless pytest && pip install -e . --no-deps
      - run: pytest -q
