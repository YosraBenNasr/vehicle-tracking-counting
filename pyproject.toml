[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtc"
version = "1.0.0"
description = "Vehicle detection, tracking, line counting and speed estimation (YOLO + ByteTrack)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "ultralytics>=8.3,<9",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
